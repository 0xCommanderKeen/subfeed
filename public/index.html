<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>subfeed</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c0b0a">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.toggle('nav-compact', localStorage.getItem('subfeed.navCompact') === 'true');</script>
</head>
<body>
  <aside class="nav" id="nav"></aside>
  <div class="nav-backdrop" id="nav-backdrop"></div>
  <header class="top">
    <button class="icon-btn" id="nav-open" type="button" aria-label="Open groups" aria-controls="nav" aria-expanded="false"></button>
    <a class="brand" href="#/all">Sub<span>/</span>feed</a>
    <form class="search" id="search" role="search">
      <input id="q" type="search" placeholder="Search" aria-label="Search video titles and descriptions" maxlength="200" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button class="search-clear" id="search-clear" type="button" aria-label="Clear the search" hidden></button>
      <kbd aria-hidden="true">/</kbd>
    </form>
  </header>
  <div class="page">
    <div class="notice" id="notice" role="status"></div>
    <main id="main"></main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
